# The checks that run without being asked.
#
# The headless subset of this repository's gates, on every push and pull
# request. Nothing here opens a window: the container (`scripts/gosbox.sh`) is
# how a GUI program is exercised, and a runner that opens a window is exactly
# what this job must not do.
#
#
# Gossamer publishes no prebuilt binaries, so the job builds `gos` from the tag
# in `GOSSAMER_VERSION`; keep that tag in step with the `gossamer-version` pin
# in `project.toml`.
name: checks

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    env:
      GOSSAMER_VERSION: v0.75.0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      # GPUI's Linux build dependencies, as README "On Linux" lists them. `gos
      # test tests` builds the binding, which links X11 and freetype.
      - name: GPUI's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxcb1-dev libxext-dev libxrender-dev \
            libxcursor-dev libxi-dev libxkbcommon-x11-dev libfreetype-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Gossamer publishes no prebuilt binaries yet; the documented install is a
      # source build. It is cloned below the runner's temp dir, outside the
      # checkout on purpose: `gos lint .`, `gos test tests` and
      # `scripts/check-all.sh` walk the working tree, and the compiler's own
      # tree holds deliberately-invalid fuzz corpus and old-syntax examples that
      # the lint suite rejects.
      #
      # This has to come before the cache step: restoring the cached `target`
      # recreates the clone directory as a side effect, and `git clone` then
      # refuses the non-empty destination it was pointed at.
      - name: Check out gossamer
        run: |
          git clone --depth 1 --branch "$GOSSAMER_VERSION" \
            https://github.com/gossamer-lang/gossamer "${{ runner.temp }}/gossamer"

      - name: Cache Cargo and the bindings
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/gossamer/target
            ~/.cache/gossamer
          # `v2` retires entries saved under the old in-tree path: a cache
          # archive restores to the absolute paths it was saved from, and a
          # primary-key hit would otherwise skip saving the out-of-tree one.
          key: ${{ runner.os }}-${{ env.GOSSAMER_VERSION }}-v2-${{ hashFiles('gpui-binding/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.GOSSAMER_VERSION }}-v2-

      # The restored `target` lands inside the fresh clone above, so only a
      # changed dependency actually rebuilds. `gos` is self-contained, so its
      # release dir goes on PATH.
      - name: Build gos
        run: |
          cargo build --manifest-path "${{ runner.temp }}/gossamer/Cargo.toml" \
            --workspace --release
          echo "${{ runner.temp }}/gossamer/target/release" >> "$GITHUB_PATH"

      - name: Lint all sources
        run: gos lint .

      - name: The headless assertion suite
        run: gos test tests

      - name: Typecheck all examples
        run: ./scripts/check-all.sh
