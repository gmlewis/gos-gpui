[package]
name = "gpui-binding"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
# The binding ABI this crate is built against. It must satisfy the patch the
# toolchain emits for its own `gossamer-binding` checkout, and that patch is a
# *path* patch — a path patch only applies when it satisfies the requirement
# stated here. So this line and the `gossamer-version` pin in `project.toml`
# are one setting in two places, and they move together.
gossamer-binding = "0.75.0"

# The editor moves the caret by grapheme cluster, as upstream's does.
unicode-segmentation = "1"

# Zed's GPU-accelerated UI framework, configured per platform.
#
# macOS takes the defaults plus `runtime_shaders`, which compiles gpui's Metal
# shader source when the renderer is created instead of shelling out to
# `xcrun metal` at build time — so this crate builds without the full Metal
# Toolchain component installed.
#
# Linux takes the X11 backend alone. gpui gates its Linux windowing backends
# independently (`src/platform/linux.rs`), and its default features would
# otherwise pull the whole Wayland stack, which a Cinnamon desktop does not
# use. `x11` brings `font-kit`, `cosmic-text` and `blade-graphics` with it.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["x11"] }
